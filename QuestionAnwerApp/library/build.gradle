apply plugin: 'com.android.library'

android {
    namespace "com.scwang.wave"
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 12
        targetSdkVersion 33
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Unit Testing
    testImplementation 'junit:junit:4.13.2'

    // Android Testing
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    // AndroidX (REPLACED old support libraries)
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.core:core:1.18.0'
    implementation 'androidx.vectordrawable:vectordrawable:1.2.0'

    // Optional dependency (keep if used in library)
    implementation 'com.larswerkman:lobsterpicker:1.0.1'

    // If NOT used, you can remove lobsterpicker safely later
}